<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Luxovia Tours</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --blue: #003366; }
        body { background-color: #f8f9fa; font-family: 'Cairo', sans-serif; }
        
        /* قسم تسجيل الدخول */
        .auth-container { max-width: 400px; margin: 100px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .auth-container h2 { text-align: center; color: var(--blue); margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; }
        .btn-auth { width: 100%; padding: 12px; background: var(--blue); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .auth-switch { text-align: center; margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; }

        /* قسم الملف الشخصي */
        .profile-header { background: var(--blue); color: white; padding: 60px 20px 100px; text-align: center; border-radius: 0 0 50px 50px; position: relative; }
        .user-avatar { width: 100px; height: 100px; background: white; border: 4px solid var(--gold); border-radius: 50%; margin: 0 auto -50px; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; z-index: 2; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .profile-content { max-width: 600px; margin: 60px auto 100px; padding: 0 20px; }
        .info-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        /* سجل الحجوزات */
        .booking-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .booking-item:last-child { border-bottom: none; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        
        .loyalty-box { background: linear-gradient(135deg, var(--gold), #b8960c); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. واجهة تسجيل الدخول (تظهر إذا لم يكن مسجلاً) -->
    <div id="authSection" class="auth-container hidden">
        <h2 id="authTitle">تسجيل الدخول</h2>
        <div class="input-group">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>
        <button class="btn-auth" id="mainAuthBtn">دخول</button>
        <p class="auth-switch" id="toggleAuth">ليس لديك حساب؟ إنشاء حساب جديد</p>
    </div>

    <!-- 2. واجهة الملف الشخصي (تظهر إذا كان مسجلاً) -->
    <div id="profileSection" class="hidden">
        <div class="profile-header">
            <div class="user-avatar" id="avatarBox">👤</div>
            <h2 id="userNameDisplay">جاري التحميل...</h2>
            <p id="userEmailDisplay">...</p>
        </div>

        <div class="profile-content">
            <!-- نقاط الولاء -->
            <div class="loyalty-box">
                <p>رصيد نقاط Luxovia</p>
                <h3 id="userPoints">1250 نقطة</h3>
            </div>

            <!-- معلومات التواصل -->
            <div class="info-card">
                <h3 style="color: var(--blue); margin-bottom: 15px;">بيانات الحساب</h3>
                <p><strong>رقم الجوال:</strong> <span id="userPhone">07XXXXXXXX</span></p>
                <button class="btn-outline" style="margin-top: 10px; width: 100%;">تعديل البيانات</button>
            </div>

            <!-- سجل الحجوزات -->
            <div class="info-card">
                <h3 style="color: var(--blue); margin-bottom: 15px;">حجوزاتي 🎒</h3>
                <div id="bookingsList">
                    <!-- نموذج لحجز واحد -->
                    <div class="booking-item">
                        <div>
                            <p style="font-weight: bold;">رحلة عمرة رمضان</p>
                            <small>3 أشخاص | 1500$</small>
                        </div>
                        <span class="status-badge status-pending">قيد الانتظار ⏳</span>
                    </div>
                </div>
            </div>

            <!-- إعدادات -->
            <div class="info-card">
                <button class="btn-outline" style="width: 100%; text-align: right; margin-bottom: 10px; border:none; border-bottom: 1px solid #eee; border-radius: 0;">تغيير كلمة المرور</button>
                <button class="btn-outline" style="width: 100%; text-align: right; color: #e63946; border:none;">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <!-- Nav الموبايل -->
    <nav class="mobile-nav">
        <a href="index.html">🏠<span>الرئيسية</span></a>
        <a href="trips.html">🎒<span>الرحلات</span></a>
        <a href="hotels.html">🏨<span>الفنادق</span></a>
        <a href="profile.html" class="active">👤<span>حسابي</span></a>
    </nav>

    <!-- البرمجة -->
 <script type="module">
   // استيراد إعداداتك الخاصة
    import { auth, db } from "../js/firebase-config.js"; 

    // استيراد الدوال من نفس الإصدار (10.7.0)
    import { 
        onAuthStateChanged, 
        signOut, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    
    import { 
        doc, getDoc, setDoc, collection, query, where, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // العناصر
    const authSection = document.getElementById('authSection');
    const profileSection = document.getElementById('profileSection');
    const toggleAuth = document.getElementById('toggleAuth');
    const authTitle = document.getElementById('authTitle');
    const mainAuthBtn = document.getElementById('mainAuthBtn');
    
    let isSignUp = false; // متغير لمتابعة الحالة (تسجيل دخول أم إنشاء حساب)

    // 1. مراقب حالة المستخدم (الحالة الأصلية)
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authSection.classList.add('hidden');
            profileSection.classList.remove('hidden');
            loadUserData(user);
            loadUserBookings(user.uid);
        } else {
            profileSection.classList.add('hidden');
            authSection.classList.remove('hidden');
        }
    });

    // 2. وظيفة التبديل بين (دخول / إنشاء حساب)
    toggleAuth.addEventListener('click', () => {
        isSignUp = !isSignUp;
        if (isSignUp) {
            authTitle.innerText = "إنشاء حساب جديد";
            mainAuthBtn.innerText = "تسجيل الحساب";
            toggleAuth.innerText = "لديك حساب بالفعل؟ سجل دخولك";
            
            // إضافة حقل الاسم ديناميكياً
            const nameDiv = document.createElement('div');
            nameDiv.className = 'input-group';
            nameDiv.id = 'nameInputGroup';
            nameDiv.innerHTML = '<input type="text" id="regName" placeholder="الاسم الكامل">';
            authSection.insertBefore(nameDiv, document.getElementById('email').parentNode);
        } else {
            authTitle.innerText = "تسجيل الدخول";
            mainAuthBtn.innerText = "دخول";
            toggleAuth.innerText = "ليس لديك حساب؟ إنشاء حساب جديد";
            const nameGroup = document.getElementById('nameInputGroup');
            if (nameGroup) nameGroup.remove();
        }
    });

    // 3. تنفيذ الدخول أو التسجيل عند الضغط على الزر
    mainAuthBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) return alert("يرجى ملء جميع الحقول");

        try {
            if (isSignUp) {
                const name = document.getElementById('regName').value;
                if (!name) return alert("يرجى إدخال الاسم");
                
                // إنشاء حساب في Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                // حفظ بيانات المستخدم في Firestore
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    name: name,
                    email: email,
                    points: 1250, // رصيد افتراضي ترحيبي
                    createdAt: new Date()
                });
                alert("تم إنشاء حسابك بنجاح!");
            } else {
                // تسجيل دخول
                await signInWithEmailAndPassword(auth, email, password);
            }
        } catch (error) {
            console.error(error);
            alert("خطأ: " + error.message);
        }
    });

    // 4. وظيفة جلب بيانات الملف الشخصي
    async function loadUserData(user) {
        document.getElementById('userEmailDisplay').innerText = user.email;
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            document.getElementById('userNameDisplay').innerText = docSnap.data().name;
            document.getElementById('userPhone').innerText = docSnap.data().phone || 'لم يتم الربط';
            document.getElementById('userPoints').innerText = `${docSnap.data().points || 0} نقطة`;
        }
    }

    // 5. وظيفة جلب الحجوزات
    async function loadUserBookings(uid) {
        const bList = document.getElementById('bookingsList');
        const q = query(collection(db, "bookings"), where("userId", "==", uid));
        const querySnapshot = await getDocs(q);
        
        bList.innerHTML = '';
        if (querySnapshot.empty) {
            bList.innerHTML = '<p style="text-align:center; padding:10px;">لا توجد حجوزات سابقة.</p>';
            return;
        }

        querySnapshot.forEach((doc) => {
            const b = doc.data();
            bList.innerHTML += `
                <div class="booking-item">
                    <div>
                        <p style="font-weight: bold;">${b.itemName}</p>
                        <small>${b.peopleCount} أشخاص | ${b.totalPrice}$</small>
                    </div>
                    <span class="status-badge ${b.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">
                        ${b.status === 'confirmed' ? 'تم التأكيد ✅' : 'قيد الانتظار ⏳'}
                    </span>
                </div>
            `;
        });
    }

    // 6. تسجيل الخروج
    document.querySelectorAll('.btn-outline').forEach(btn => {
        if (btn.innerText === "تسجيل الخروج") {
            btn.onclick = () => signOut(auth);
        }
    });
</script>
</body>
</html>
