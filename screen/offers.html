<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>عروض لوكسوفيا تورز الحصرية | Luxovia Tours</title>
    
    <!-- استيراد ملف التنسيقات الخارجي (يحتوي على الهيدر والهامبرجر) -->
    <link rel="stylesheet" href="../css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ============================================================
           تنسيقات خاصة بصفحة العروض فقط (ليست في الملف الخارجي)
        ============================================================ */
        
        /* خلفية الصور الثابتة للهيرو */
        .offers-hero {
            position: relative;
            text-align: center;
            padding: 160px 24px 120px;
            color: white;
            margin-bottom: 40px;
            overflow: hidden;
            isolation: isolate;
            min-height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* خلفية الصور الثابتة */
        .offers-slideshow-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .offers-slideshow-bg .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2.5s ease-in-out; /* انتقال بطيء وسلس (2.5 ثانية) */
            will-change: opacity;
        }

        .offers-slideshow-bg .slide.active {
            opacity: 1;
            z-index: 1;
        }

        /* طبقة التدرج فوق الخلفية */
        .offers-header-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 25, 47, 0.5) 0%, 
                rgba(212, 175, 55, 0.2) 50%,
                rgba(10, 25, 47, 0.6) 100%);
            z-index: 2;
        }

        /* عناصر الزينة الدائرية */
        .offers-hero::before {
            content: "";
            position: absolute;
            top: -20%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--color-gold-500) 0%, transparent 70%);
            opacity: 0.15;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: floatGlow 8s ease-in-out infinite;
        }

        .offers-hero::after {
            content: "";
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--color-blue-400) 0%, transparent 70%);
            opacity: 0.12;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: floatGlow 10s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 20px) scale(1.05); }
        }

        @keyframes fadeInUpHeader {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offers-header-content {
            position: relative;
            z-index: 4;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeInUpHeader 0.8s ease-out;
        }

        .offers-hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            animation: glowText 3s ease-in-out infinite;
        }

        @keyframes glowText {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(212,175,55,0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.6)); }
        }

        .offers-hero p {
            font-size: 1.3rem;
            opacity: 0.95;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            animation: fadeInUpHeader 0.8s ease-out 0.2s both;
        }

        /* مؤشرات الصور */
        .slideshow-indicator-offers {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 4;
            direction: ltr;
        }

        .slideshow-dot-offers {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.4);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .slideshow-dot-offers.active {
            background: #D4AF37;
            width: 60px;
        }

        .slideshow-dot-offers.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.3);
            animation: progressBar 10s linear forwards; /* 10 ثواني لكل صورة */
        }

        @keyframes progressBar {
            from { width: 100%; }
            to { width: 0%; }
        }

        /* شبكة العروض */
        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            margin-bottom: 80px;
            padding-bottom: 20px;
        }

        /* بطاقة العرض */
        .offer-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 3px solid #D4AF37;
            cursor: pointer;
        }

        .offer-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        }

        /* شارة الخصم */
        .discount-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #D4AF37, #FFD700);
            color: #1a2a3a;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 800;
            z-index: 10;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }

        /* صورة العرض */
        .offer-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .offer-card:hover .offer-img {
            transform: scale(1.05);
        }

        /* محتوى البطاقة */
        .offer-body {
            padding: 24px;
        }

        .offer-body h3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a56db;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .offer-description {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        /* حاوية الأسعار */
        .price-container {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .old-price {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .new-price {
            color: #D4AF37;
            font-size: 1.8rem;
            font-weight: 800;
        }
        
        .new-price span {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* مؤقت العرض */
        .offer-timer {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            padding: 10px 14px;
            border-radius: 16px;
            text-align: center;
            font-size: 0.85rem;
            margin: 15px 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* زر العرض */
        .btn-offer {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1a56db, #0f3b8a);
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .btn-offer:hover {
            background: linear-gradient(135deg, #D4AF37, #b8960c);
            color: #1a2a3a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        /* حالة عدم وجود بيانات */
        .empty-offers {
            text-align: center;
            grid-column: 1 / -1;
            padding: 80px 24px;
            background: white;
            border-radius: 28px;
            color: #64748b;
        }

        .empty-offers i {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            color: #D4AF37;
        }

        /* سكيلتون */
        .skeleton-offer {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            border-top: 3px solid #D4AF37;
        }

        .skeleton-img {
            height: 240px;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-body {
            padding: 24px;
        }

        .skeleton-title {
            height: 24px;
            width: 70%;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .skeleton-price {
            height: 36px;
            width: 50%;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin: 12px 0;
        }

        .skeleton-timer {
            height: 44px;
            width: 100%;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 16px;
            margin: 15px 0;
        }

        .skeleton-btn {
            height: 50px;
            width: 100%;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 50px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* التصميم المتجاوب */
        @media (max-width: 768px) {
            .offers-hero {
                padding: 120px 20px 80px;
                min-height: 450px;
            }
            
            .offers-hero h1 {
                font-size: 2rem;
            }
            
            .offers-hero p {
                font-size: 1rem;
            }
            
            .offers-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            
            .offer-img {
                height: 200px;
            }
            
            .offer-body h3 {
                font-size: 1.2rem;
            }
            
            .new-price {
                font-size: 1.5rem;
            }

            .slideshow-dot-offers {
                width: 30px;
            }
            
            .slideshow-dot-offers.active {
                width: 45px;
            }
        }

        @media (max-width: 480px) {
            .offers-hero h1 {
                font-size: 1.6rem;
            }
            
            .discount-badge {
                top: 12px;
                right: 12px;
                padding: 4px 12px;
                font-size: 0.75rem;
            }
            
            .offer-body {
                padding: 16px;
            }

            .slideshow-dot-offers {
                width: 25px;
            }
            
            .slideshow-dot-offers.active {
                width: 35px;
            }
        }

        /* زر إعادة المحاولة */
        .retry-btn {
            margin-top: 20px;
            padding: 10px 28px;
            background: linear-gradient(135deg, #1a56db, #0f3b8a);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            background: linear-gradient(135deg, #D4AF37, #b8960c);
            color: #1a2a3a;
            transform: translateY(-2px);
        }
    </style>
</head>

    <script type="module">
        import { db } from "../js/firebase-config.js";
        import { collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const offersContainer = document.getElementById('offers-list');
        
        // ============================================
        // 1. نظام تبديل الخلفيات (صور JPG - انتقال بطيء 2.5 ثانية)
        // ============================================
        const slides = document.querySelectorAll('.offers-slideshow-bg .slide');
        const dots = document.querySelectorAll('.slideshow-dot-offers');
        let currentIndex = 0;
        let slideInterval;
        const SLIDE_DURATION = 10000; // 10 ثواني لكل صورة
        const FADE_DURATION = 2500;    // 2.5 ثانية لتأثير التلاشي

        function changeSlide(index) {
            if (index === currentIndex) return;
            
            // إزالة الـ active من الشريحة الحالية
            slides[currentIndex].classList.remove('active');
            // إزالة الـ active من النقطة الحالية
            dots[currentIndex].classList.remove('active');
            // إعادة تعيين animation للـ dot الجديد
            dots[currentIndex].style.animation = 'none';
            
            // تحديث المؤشر الحالي
            currentIndex = index;
            
            // إضافة الـ active للشريحة الجديدة
            slides[currentIndex].classList.add('active');
            // إضافة الـ active للنقطة الجديدة
            dots[currentIndex].classList.add('active');
            
            // إعادة تشغيل animation للـ dot الجديد
            dots[currentIndex].style.animation = 'none';
            setTimeout(() => {
                dots[currentIndex].style.animation = '';
            }, 10);
        }

        function nextSlide() {
            let nextIndex = (currentIndex + 1) % slides.length;
            changeSlide(nextIndex);
        }

        function resetSlideTimer() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, SLIDE_DURATION);
        }

        function initSlideshow() {
            // التأكد من أن الشريحة الأولى فقط هي النشطة في البداية
            slides.forEach((slide, i) => {
                if (i === 0) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            
            // إضافة مستمعي الأحداث للنقاط
            dots.forEach((dot, i) => {
                dot.addEventListener('click', () => {
                    resetSlideTimer();
                    changeSlide(i);
                });
            });
            
            // بدء التبديل التلقائي
            resetSlideTimer();
        }

        initSlideshow();

        // ============================================
        // 2. زر الهمبرجر والقائمة الجانبية
        // ============================================
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebarNav = document.querySelector('.sidebar-nav');
        const sidebarOverlay = document.querySelector('.sidebar-overlay');

        if (hamburgerBtn && sidebarNav && sidebarOverlay) {
            hamburgerBtn.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                sidebarNav.classList.toggle('active');
                sidebarOverlay.classList.toggle('active');
                document.body.classList.toggle('no-scroll');
            });

            sidebarOverlay.addEventListener('click', () => {
                hamburgerBtn.classList.remove('active');
                sidebarNav.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                document.body.classList.remove('no-scroll');
            });

            const sidebarClose = document.querySelector('.sidebar-close');
            if (sidebarClose) {
                sidebarClose.addEventListener('click', () => {
                    hamburgerBtn.classList.remove('active');
                    sidebarNav.classList.remove('active');
                    sidebarOverlay.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                });
            }
        }

        // ============================================
        // 3. تأثير الهيدر عند السكرول
        // ============================================
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.main-header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ============================================
        // 4. دوال العروض
        // ============================================
        function getTimeRemaining(endDate) {
            const now = new Date();
            const end = new Date(endDate);
            const diff = end - now;
            
            if (diff <= 0) return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0 };
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (86400000)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (3600000)) / (1000 * 60));
            const seconds = Math.floor((diff % (60000)) / 1000);
            
            return { expired: false, days, hours, minutes, seconds };
        }

        function showSkeleton() {
            offersContainer.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const skeletonCard = `
                    <div class="skeleton-offer">
                        <div class="skeleton-img"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-price"></div>
                            <div class="skeleton-timer"></div>
                            <div class="skeleton-btn"></div>
                        </div>
                    </div>
                `;
                offersContainer.insertAdjacentHTML('beforeend', skeletonCard);
            }
        }

        function createOfferCard(offer) {
            const currentPrice = offer.current_price || offer.newPrice || 0;
            const oldPrice = offer.old_price || offer.oldPrice || 0;
            const discountPercent = Math.round(((oldPrice - currentPrice) / oldPrice) * 100) || 0;
            const title = offer.title || 'عرض مميز';
            const name = offer.name || '';
            const description = offer.description || name;
            const imageUrl = offer.image || offer.img || 'https://placehold.co/600x400/e2e8f0/475569?text=Offer+Image';
            const endDate = offer.end_date || offer.expiryDate;
            
            let timerHtml = '<div class="offer-timer"><i class="fas fa-hourglass-half"></i> عرض محدود الكمية</div>';
            if (endDate) {
                const timeLeft = getTimeRemaining(endDate);
                if (!timeLeft.expired) {
                    let timerText = '';
                    if (timeLeft.days > 0) timerText += `${timeLeft.days} يوم `;
                    if (timeLeft.hours > 0) timerText += `${timeLeft.hours} ساعة `;
                    if (timeLeft.minutes > 0) timerText += `${timeLeft.minutes} دقيقة`;
                    timerHtml = `<div class="offer-timer"><i class="fas fa-clock"></i> ينتهي خلال: ${timerText || 'أقل من دقيقة'}</div>`;
                } else {
                    timerHtml = '<div class="offer-timer" style="background:#fee2e2; color:#dc2626;"><i class="fas fa-ban"></i> انتهى العرض</div>';
                }
            }
            
            return `
                <div class="offer-card" onclick="window.location.href='trip-details.html?id=${offer.id}'">
                    <div class="discount-badge"><i class="fas fa-fire"></i> خصم ${discountPercent}%</div>
                    <img src="${imageUrl}" class="offer-img" alt="${title}" onerror="this.src='https://placehold.co/600x400/e2e8f0/475569?text=Offer+Image'">
                    <div class="offer-body">
                        <h3>${title}</h3>
                        ${description ? `<div class="offer-description"><i class="fas fa-map-marker-alt" style="color:#D4AF37; margin-left:5px;"></i> ${description.substring(0, 100)}${description.length > 100 ? '...' : ''}</div>` : ''}
                        <div class="price-container">
                            <span class="new-price">${currentPrice.toLocaleString()} <span>ر.س</span></span>
                            <span class="old-price">${oldPrice.toLocaleString()} ر.س</span>
                        </div>
                        ${timerHtml}
                        <button class="btn-offer"><i class="fas fa-gem"></i> اغتنم العرض الآن</button>
                    </div>
                </div>
            `;
        }

        async function fetchOffers() {
            showSkeleton();
            
            try {
                const offersQuery = query(collection(db, "offers"));
                const querySnapshot = await getDocs(offersQuery);
                offersContainer.innerHTML = ''; 

                if (querySnapshot.empty) {
                    offersContainer.innerHTML = `
                        <div class="empty-offers">
                            <i class="fas fa-gift"></i>
                            <p style="font-size: 20px; font-weight: 600; margin: 16px 0;">لا توجد عروض حالية</p>
                            <p style="font-size: 16px;">ترقبوا عروضنا الحصرية قريباً!</p>
                            <button class="retry-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> تحديث الصفحة</button>
                        </div>
                    `;
                    return;
                }

                const offers = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    offers.push({ 
                        id: doc.id, 
                        ...data,
                        current_price: data.current_price || data.currentPrice,
                        old_price: data.old_price || data.oldPrice,
                        end_date: data.end_date || data.endDate,
                        image: data.image || data.img
                    });
                });

                offers.sort((a, b) => {
                    const discountA = ((a.old_price - a.current_price) / a.old_price) || 0;
                    const discountB = ((b.old_price - b.current_price) / b.old_price) || 0;
                    return discountB - discountA;
                });

                offers.forEach((offer, index) => {
                    const card = createOfferCard(offer);
                    offersContainer.insertAdjacentHTML('beforeend', card);
                });

                const cards = document.querySelectorAll('.offer-card');
                cards.forEach((card, index) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(30px)';
                    setTimeout(() => {
                        card.style.transition = 'all 0.6s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, index * 100);
                });
                
            } catch (error) {
                console.error("خطأ في جلب العروض:", error);
                offersContainer.innerHTML = `
                    <div class="empty-offers">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p style="font-size: 20px; font-weight: 600; margin: 16px 0;">حدث خطأ أثناء تحميل العروض</p>
                        <p style="font-size: 16px;">يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى</p>
                        <button class="retry-btn" onclick="location.reload()"><i class="fas fa-redo-alt"></i> إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        fetchOffers();
    </script>
</body>
</html>
